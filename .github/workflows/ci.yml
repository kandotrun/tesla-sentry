name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up analyzer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg python3-venv
          python3 -m venv .venv-analyzer
          .venv-analyzer/bin/python -m pip install --disable-pip-version-check -r containers/analyzer/requirements-dev.txt
          echo "$PWD/.venv-analyzer/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run tests, type checks, lint, and builds
        run: npm run check

      - name: Verify Cloudflare bundle
        run: npm run cf:dry-run

      - name: Build and smoke-test analyzer container
        run: npm run analyzer:container-smoke
